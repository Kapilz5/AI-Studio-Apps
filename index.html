<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Cards - AI Card Manager</title>
    
    <!-- PWA & iOS Native Tags -->
    <meta name="theme-color" content="#050b1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Cards">
    
    <!-- App Icons -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/wallet.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/fluency/32/wallet.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://img.icons8.com/fluency/16/wallet.png">
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Fix for environment detection without overwriting actual keys
      if (typeof window.process === 'undefined') {
        window.process = { env: {} };
      }
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
               // Dynamic Brand Colors mapped to CSS Variables
               blue: {
                 50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                 100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                 200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                 300: 'rgb(var(--color-primary-300) / <alpha-value>)',
                 400: 'rgb(var(--color-primary-400) / <alpha-value>)',
                 500: 'rgb(var(--color-primary-500) / <alpha-value>)',
                 600: 'rgb(var(--color-primary-600) / <alpha-value>)',
                 700: 'rgb(var(--color-primary-700) / <alpha-value>)',
                 800: 'rgb(var(--color-primary-800) / <alpha-value>)',
                 900: 'rgb(var(--color-primary-900) / <alpha-value>)',
                 950: 'rgb(var(--color-primary-950) / <alpha-value>)',
               },
               indigo: {
                 50: 'rgb(var(--color-secondary-50) / <alpha-value>)',
                 100: 'rgb(var(--color-secondary-100) / <alpha-value>)',
                 200: 'rgb(var(--color-secondary-200) / <alpha-value>)',
                 300: 'rgb(var(--color-secondary-300) / <alpha-value>)',
                 400: 'rgb(var(--color-secondary-400) / <alpha-value>)',
                 500: 'rgb(var(--color-secondary-500) / <alpha-value>)',
                 600: 'rgb(var(--color-secondary-600) / <alpha-value>)',
                 700: 'rgb(var(--color-secondary-700) / <alpha-value>)',
                 800: 'rgb(var(--color-secondary-800) / <alpha-value>)',
                 900: 'rgb(var(--color-secondary-900) / <alpha-value>)',
                 950: 'rgb(var(--color-secondary-950) / <alpha-value>)',
               }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'bounce-slow': 'bounce 2s infinite',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Theme (Blue/Indigo) Fallback */
            --color-primary-50: 239 246 255;
            --color-primary-100: 219 234 254;
            --color-primary-200: 191 219 254;
            --color-primary-300: 147 197 253;
            --color-primary-400: 96 165 250;
            --color-primary-500: 59 130 246;
            --color-primary-600: 37 99 235;
            --color-primary-700: 29 78 216;
            --color-primary-800: 30 64 175;
            --color-primary-900: 30 58 138;
            --color-primary-950: 23 37 84;

            --color-secondary-50: 238 242 255;
            --color-secondary-100: 224 231 255;
            --color-secondary-200: 199 210 254;
            --color-secondary-300: 165 180 252;
            --color-secondary-400: 129 140 248;
            --color-secondary-500: 99 102 241;
            --color-secondary-600: 79 70 229;
            --color-secondary-700: 67 56 202;
            --color-secondary-800: 55 48 163;
            --color-secondary-900: 49 46 129;
            --color-secondary-950: 30 27 75;

            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
        }
        
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        #root {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .dark body {
            background-color: #020617;
        }

        .card-gradient {
            background: linear-gradient(135deg, rgb(var(--color-primary-600)) 0%, rgb(var(--color-primary-800)) 100%);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Highly Visible Scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
        
        button, a {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
        
        .safe-bottom {
            padding-bottom: calc(1.5rem + var(--sab));
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.4"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
